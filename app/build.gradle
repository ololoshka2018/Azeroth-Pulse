plugins { id 'com.android.application' }
android {
    namespace 'ru.ivan.azerothpulse'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig { applicationId 'ru.ivan.azerothpulse'; minSdk 26; targetSdk 35; versionCode 24; versionName '0.18.6' }
    buildFeatures { buildConfig true }
    defaultConfig { buildConfigField "boolean", "TEST_BUILD", providers.gradleProperty("pulseTestBuild").getOrElse("false") }
    defaultConfig { buildConfigField "String", "BATTLENET_SERVICE_URL", groovy.json.JsonOutput.toJson(providers.gradleProperty("pulseApiBase").getOrElse("")) }
    buildTypes {
        debug { applicationIdSuffix '.dev'; versionNameSuffix '-dev' }
        release {
            debuggable false
            minifyEnabled false
        }
    }
    packaging { jniLibs { useLegacyPackaging true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies {
    implementation 'org.jsoup:jsoup:1.21.2'
    implementation 'com.google.mlkit:translate:17.0.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
