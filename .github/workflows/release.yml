name: Signed release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested version on GitHub Releases
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Validate code and build unsigned release
        run: |
          python3 tests/check_talents.py
          node tests/extractor.cjs
          bash ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Prepare temporary signing directory
        run: echo "PULSE_SIGNING_DIR=$RUNNER_TEMP/pulse-signing" >> "$GITHUB_ENV"
      - name: Restore owner signing keys
        env:
          ANDROID_SIGNING_BUNDLE_BASE64: ${{ secrets.ANDROID_SIGNING_BUNDLE_BASE64 }}
        run: python3 scripts/restore_signing.py "$PULSE_SIGNING_DIR"
      - name: Sign and verify release
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('app/src/main/AndroidManifest.xml').getroot().attrib['{http://schemas.android.com/apk/res/android}versionName'])")
          python3 scripts/sign_release.py app/build/outputs/apk/release/app-release-unsigned.apk "build/Azeroth-Pulse-$version.apk"
      - name: Save signed APK for testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-apk
          path: build/Azeroth-Pulse-*
          if-no-files-found: error
      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('app/src/main/AndroidManifest.xml').getroot().attrib['{http://schemas.android.com/apk/res/android}versionName'])")
          test -f "docs/releases/$version.md"
          gh release create "v$version" "build/Azeroth-Pulse-$version.apk" "build/Azeroth-Pulse-$version.apk.sha256" --target "$GITHUB_SHA" --title "Azeroth Pulse $version" --notes-file "docs/releases/$version.md" --latest
      - name: Delete temporary signing files
        if: always()
        run: rm -rf -- "$PULSE_SIGNING_DIR"
